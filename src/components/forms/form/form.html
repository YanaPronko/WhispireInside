<form class="contact__form contact-form" data-fls-form="ajax" action="php/sendmail/" method="POST" data-fls-form-gotoerr>
	<div class="contact-form__field">
		<label class="contact-form__label" for="contact-service">
			<img src="assets/svgicons/sparkles-outline-icon.svg" alt="" width="20" height="20">
			<span>Выберите услугу *</span>
		</label>
		<select id="contact-service" data-fls-select data-fls-select-modif="contact" data-fls-select-z-index="60" data-fls-select-show-selected name="service_type" required data-fls-form-errtext="Выберите услугу">
			<option value="" selected>Выберите...</option>
			<option value="Шепот в тени">Шепот в тени</option>
			<option value="Второй шанс">Второй шанс</option>
			<option value="Разбор одиночества">Разбор одиночества</option>
			<option value="Психологическая сессия — Шепот с собой">Психологическая сессия — Шепот с собой</option>
			<option value="Работа с метафорическими картами (МАК)">Работа с метафорическими картами (МАК)</option>
			<option value="Метафора и «Безопасное место»">Метафора и «Безопасное место»</option>
			<option value="Коуч-сессия — движение к цели">Коуч-сессия — движение к цели</option>
		</select>
	</div>

	<div class="contact-form__field">
		<label class="contact-form__label" for="contact-name">
			<img src="assets/svgicons/message-icon.svg" alt="" width="20" height="20">
			<span>Ваше имя *</span>
		</label>
		<input id="contact-name" data-fls-input autocomplete="off" type="text" name="name" required data-fls-form-errtext="Введите имя" placeholder="Как к вам обращаться?" class="input">
	</div>

	<div class="contact-form__field">
		<label class="contact-form__label" for="contact-date">
			<img src="assets/svgicons/calendar-icon.svg" alt="" width="20" height="20">
			<span>Желаемая дата *</span>
		</label>
		<input id="contact-date" data-fls-input data-fls-datepicker autocomplete="off" type="text" name="desired_date" required data-fls-form-errtext="Выберите дату" placeholder="Выберите дату" class="input">
	</div>

	<div class="contact-form__field">
		<label class="contact-form__label" for="contact-phone">
			<img src="assets/svgicons/phone-icon.svg" alt="" width="20" height="20">
			<span>Телефон *</span>
		</label>
		<div class="contact-form__phone-row">
			<select id="contact-phone-code" data-fls-select data-fls-select-modif="contact" data-fls-select-z-index="60" name="phone_code" required data-fls-form-errtext="Выберите код страны">
				<option value="+7" selected>+7 (Россия)</option>
				<option value="+380">+380 (Украина)</option>
				<option value="+375">+375 (Беларусь)</option>
				<option value="+1">+1 (США/Канада)</option>
				<option value="+44">+44 (Великобритания)</option>
				<option value="+49">+49 (Германия)</option>
				<option value="+33">+33 (Франция)</option>
				<option value="+34">+34 (Испания)</option>
				<option value="+39">+39 (Италия)</option>
				<option value="+48">+48 (Польша)</option>
			</select>
			<input id="contact-phone" data-fls-input data-fls-input-mask="+7 (999) 999-99-99" autocomplete="off" type="tel" name="phone" required data-fls-form-errtext="Введите номер телефона" placeholder="+7 (___) ___-__-__" class="input">
		</div>
	</div>

	<div class="contact-form__field">
		<label class="contact-form__label" for="contact-email">
			<img src="assets/svgicons/mail-icon.svg" alt="" width="20" height="20">
			<span>Email *</span>
		</label>
		<input id="contact-email" data-fls-input autocomplete="off" type="email" name="email" required data-fls-form-errtext="Введите корректный email" placeholder="your@email.com" class="input">
	</div>

	<div class="contact-form__field">
		<label class="contact-form__label" for="contact-message">
			<img src="assets/svgicons/message-icon.svg" alt="" width="20" height="20">
			<span>Ваше сообщение</span>
		</label>
		<textarea id="contact-message" data-fls-input data-fls-input-autoheight autocomplete="off" name="message" placeholder="Расскажите о том, что вас волнует..." class="input"></textarea>
	</div>

	<button type="submit" class="contact-form__button">
		<img src="assets/svgicons/send-icon.svg" alt="" width="18" height="18">
		<span>Отправить заявку</span>
	</button>

	<p class="contact-form__note">Нажимая кнопку, вы соглашаетесь на обработку персональных данных</p>
</form>
